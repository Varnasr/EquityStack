name: Run Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # 3.12. The pins in requirements.txt were resolved together and the
        # suite (101 tests) passes on 3.12 as it did on 3.11 (checked 2 Nov 2026).
        # CI moved from 3.11 because numpy 2.5 publishes no Python 3.11 wheel, so
        # every Dependabot numpy bump failed to install here.
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$(pwd):$PYTHONPATH" >> $GITHUB_ENV

    - name: Run tests
      run: pytest tests/